<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Маршрут</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg: #0f141c;
      --bar: #161d28;
      --ink: #f2f5f8;
      --muted: #8b97a8;
      --line: #2a3444;
      --acc: #3b82f6;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Segoe UI", "PT Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      flex-direction: column;
    }
    .bar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 12px 18px;
      background: var(--bar);
      border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: .01em; }
    .file, button, select {
      font: inherit;
      color: var(--ink);
      background: #243044;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 8px 14px;
      cursor: pointer;
    }
    .file { background: var(--acc); border-color: transparent; font-weight: 650; }
    .file:hover, button:hover { filter: brightness(1.08); }
    #fileInput { display: none; }
    .hint { color: var(--muted); font-size: 13px; }
    #map { flex: 1; min-height: 0; }
    .plane-wrap { background: none !important; border: 0 !important; }
    .leaflet-control-attribution { font-size: 10px; }
  </style>
</head>
<body>
  <div class="bar">
    <h1>Маршрут полёта</h1>
    <label class="file" for="fileInput">Загрузить файл</label>
    <input id="fileInput" type="file" accept=".txt,.csv,.dat" />
    <span class="hint" id="status">Файл: широта и долгота в строке, например 52.3222 37,1991</span>
  </div>
  <div id="map" role="application" aria-label="Карта маршрута"></div>

<script>
const map = L.map("map", { zoomControl: true }).setView([55.5, 40.5], 5);
L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}",
  { attribution: "© Esri", maxZoom: 18 }
).addTo(map);
setTimeout(() => map.invalidateSize(), 80);
window.addEventListener("resize", () => map.invalidateSize());

let line, startDot, plane;

function num(s) {
  return parseFloat(String(s).trim().replace(",", "."));
}

function parseCoords(text) {
  const pts = [];
  const pair = /(-?\d+(?:[.,]\d+)?)\s+(-?\d+(?:[.,]\d+)?)/;
  for (let raw of text.split(/\r?\n/)) {
    let line = raw.trim();
    if (!line || line.startsWith("#")) continue;
    line = line.replace(/[()]/g, " ").trim();
    const named = Object.fromEntries(
      [...line.matchAll(/\b(lat|lon)=(-?\d+(?:[.,]\d+)?)/g)].map(m => [m[1], num(m[2])])
    );
    let lat, lon;
    if ("lat" in named && "lon" in named) {
      lat = named.lat;
      lon = named.lon;
    } else {
      const m = line.match(pair);
      if (!m) continue;
      lat = num(m[1]);
      lon = num(m[2]);
    }
    if (Number.isFinite(lat) && Number.isFinite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180) {
      pts.push([lat, lon]);
    }
  }
  return pts;
}

function heading(a, b) {
  const φ1 = a[0] * Math.PI / 180, φ2 = b[0] * Math.PI / 180;
  const Δλ = (b[1] - a[1]) * Math.PI / 180;
  const y = Math.sin(Δλ) * Math.cos(φ2);
  const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}

function planeIcon(trk) {
  const svg =
    `<svg width="44" height="44" viewBox="0 0 64 64" style="transform:rotate(${trk}deg);filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))" xmlns="http://www.w3.org/2000/svg">` +
    `<defs><linearGradient id="ac" x1="32" y1="2" x2="32" y2="62" gradientUnits="userSpaceOnUse">` +
    `<stop stop-color="#FFE566"/><stop offset="1" stop-color="#E0A800"/></linearGradient></defs>` +
    `<path fill="url(#ac)" stroke="#6e5400" stroke-width="1.15" stroke-linejoin="round" d="` +
    `M32 2.4c1.7 0 2.8 3.2 3.3 11.4l20.2 12.2c3.3 1.8 3.4 5.4-.2 6.4L35.8 30.6l1 13.4 11.8 9.4c2 1.6 1.2 4.4-1.6 4.3L33.2 51.4 32 61.2l-1.2-9.8-13.8 6.3c-2.8.1-3.6-2.7-1.6-4.3l11.8-9.4 1-13.4L8.7 32.4c-3.6-1-.5-4.6 2.8-6.4L31.7 13.8C32.2 5.6 33.3 2.4 32 2.4z"/>` +
    `</svg>`;
  return L.divIcon({ className: "plane-wrap", html: svg, iconSize: [44, 44], iconAnchor: [22, 22] });
}

function clear() {
  if (line) map.removeLayer(line);
  if (startDot) map.removeLayer(startDot);
  if (plane) map.removeLayer(plane);
  line = startDot = plane = null;
}

function draw(pts) {
  clear();
  if (pts.length < 2) {
    document.getElementById("status").textContent = "Нужно минимум две точки";
    return;
  }
  line = L.polyline(pts, {
    color: "#2563eb",
    weight: 4,
    opacity: 0.95,
    lineJoin: "round",
    lineCap: "round"
  }).addTo(map);
  startDot = L.circleMarker(pts[0], {
    radius: 5,
    color: "#fff",
    weight: 2,
    fillColor: "#2563eb",
    fillOpacity: 1
  }).addTo(map);
  const last = pts[pts.length - 1];
  const prev = pts[pts.length - 2];
  plane = L.marker(last, { icon: planeIcon(heading(prev, last)), zIndexOffset: 800 }).addTo(map);
  map.fitBounds(line.getBounds(), { padding: [48, 48] });
}

document.getElementById("fileInput").addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = ev => draw(parseCoords(String(ev.target.result)));
  r.readAsText(f, "utf-8");
});
</script>
</body>
</html>
